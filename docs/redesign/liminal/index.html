<title>Liminal Sanctuary</title>
<style>
:root{
  color-scheme: dark;
  /* dusk tokens: this page is single-theme on purpose */
  --night:#12142A;          /* page fallback behind the scene */
  --scrim:rgba(24,25,46,.88);/* text panel; worst case over the brightest sky gives >= 9.5:1 for --ink */
  --scrim-solid:#1B1C33;
  --scrim-line:rgba(244,243,247,.24);
  --ink:#F4F3F7;            /* headline + body, AAA on scrim */
  --ink-2:#D8DAE6;          /* secondary text, AAA on scrim */
  --warm:#F0D5BF;           /* primary button fill ("distant light") */
  --warm-hover:#F7E3D1;
  --on-warm:#1A1B2E;        /* 12:1 on --warm */
  --teal:#A9DCD6;           /* quiet link, 10:1 on scrim */
  --lilac:#C9BFEA;
  --focus:#FFE3A3;          /* outer focus ring */
  --focus-gap:#12142A;      /* inner gap so the ring reads on light and dark */
  --dock:rgba(14,15,30,.92);
  --dock-line:rgba(201,191,234,.45);
  --chip:#2A2B48;
  --chip-on:#C9BFEA;
  --on-chip-on:#16172B;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --dock-h:76px;
  --font-body:'Readex Pro', 'Lexend', Verdana, system-ui, sans-serif;
  --font-display:'Tenor Sans', Optima, Candara, 'Segoe UI', sans-serif; /* DESIGN.md D8: display, tracked caps */
  --font-mark:var(--font-display);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font:400 18px/1.6 var(--font-body);overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-gap)}

/* ---------- stage: canvas + poster ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:#3a3658}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .2s linear;touch-action:manipulation}
.stage canvas.ready{opacity:1}
.stage picture,.stage img{position:absolute;inset:0;width:100%;height:100%}
.stage img{object-fit:cover;object-position:62% 50%}
.stage.three-on.rendered picture{visibility:hidden}
.stage:not(.three-on) canvas{display:none}
@media (prefers-reduced-motion:reduce){.stage canvas{transition:none}}

/* ---------- overlay ---------- */
.overlay{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr;
  padding:16px var(--gutter-r) calc(var(--dock-h) + 20px) var(--gutter-l);pointer-events:none}
.overlay > *{pointer-events:auto}
.top{display:flex;justify-content:flex-end;align-items:flex-start}
.lang{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--scrim);border:1.5px solid var(--scrim-line)}
.lang button{min-width:52px;min-height:44px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--ink);font-weight:700;font-size:16px;letter-spacing:.04em;cursor:pointer;touch-action:manipulation}
.lang button:hover{background:rgba(244,243,247,.12)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-warm)}

.hero{align-self:center;width:100%;max-width:520px;margin:24px 0 0 clamp(0px, 4vw, 72px);
  background:var(--scrim);border:1.5px solid var(--scrim-line);border-radius:28px;padding:32px 36px 30px}
.mark{margin:0 0 18px;font:400 17px/1 var(--font-mark);letter-spacing:.28em;text-transform:uppercase;color:var(--warm)}
h1{margin:0 0 16px;font:400 clamp(28px,3.1vw,42px)/1.18 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-wrap:balance}
.lede{margin:0 0 26px;color:var(--ink-2);max-width:36ch}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.btn-primary{min-height:56px;min-width:180px;padding:0 32px;border-radius:999px;border:0;background:var(--warm);color:var(--on-warm);
  font:700 19px/1 var(--font-body);letter-spacing:.01em;cursor:pointer;touch-action:manipulation;box-shadow:0 0 40px rgba(240,213,191,.18)}
.btn-primary:hover{background:var(--warm-hover)}
.link-quiet{display:inline-flex;align-items:center;min-height:48px;padding:0 4px;color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;border-radius:6px}
.link-quiet:hover{text-decoration-thickness:3px}
.note{margin:14px 0 0;font-size:16px;color:var(--ink-2)}
.note:empty{display:none}

/* ---------- prototype dock (not part of the landing) ---------- */
.dock{position:fixed;z-index:2;left:var(--gutter-l);right:var(--gutter-r);bottom:max(12px, env(safe-area-inset-bottom, 0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px 8px 16px;margin:0 auto;max-width:1180px;
  background:var(--dock);border:1.5px dashed var(--dock-line);border-radius:20px;color:var(--ink);font-size:15px;line-height:1.3}
.dock-title{font-weight:700;color:var(--lilac);letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap}
.seg{display:flex;gap:4px;padding:3px;border-radius:14px;background:var(--chip)}
.seg button,.tog,.fx-sum{min-height:44px;padding:0 14px;border-radius:11px;border:0;background:transparent;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.seg button:hover,.tog:hover,.fx-sum:hover{background:rgba(244,243,247,.12)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--on-chip-on)}
.seg button .n{opacity:.75;margin-right:6px;font-weight:400}
.tog,.fx-sum{background:var(--chip);border:1.5px solid rgba(244,243,247,.28)}
.tog b,.fx-sum b{font-weight:700;color:var(--warm)}
.desc{flex:1 1 200px;min-width:0;color:var(--ink-2);margin:0}
.desc b{color:var(--ink)}
.toggles{display:flex;gap:8px;align-items:center}
.fx{position:relative}
.fx-sum{display:inline-flex;align-items:center;gap:6px;list-style:none}
.fx-sum::-webkit-details-marker{display:none}
.fx-sum::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-135deg) translate(-2px,-2px);margin-left:4px}
.fx[open] .fx-sum::after{transform:rotate(45deg) translate(-2px,-2px)}
.fx-panel{position:absolute;right:0;bottom:calc(100% + 12px);width:min(420px, calc(100vw - 32px));display:grid;gap:10px;padding:14px;
  background:var(--scrim-solid);border:1.5px solid var(--dock-line);border-radius:16px}
.fx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fx-row > span{color:var(--ink-2);font-weight:600}
.fx-panel .seg button{padding:0 12px}
.fx-off .fx-dep{opacity:.5}
/* ---------- fallback message ---------- */
.fallback{display:none;margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--scrim-solid);border:1.5px solid var(--scrim-line);color:var(--ink);font-size:16px}
.no-webgl .fallback{display:block}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- tablet / phone ---------- */
@media (max-width:900px){
  .hero{max-width:560px;margin-left:0}
}
@media (max-width:760px), (orientation:portrait) and (max-width:1100px){
  :root{--dock-h:112px}
  .overlay{grid-template-rows:auto 1fr auto}
  .hero{grid-row:3;align-self:end;max-width:none;margin:0;padding:24px 22px 22px;border-radius:24px}
  .stage img{object-position:50% 30%}
  .dock{padding:8px;gap:8px;justify-content:space-between}
  .dock-title,.desc{display:none}
  .seg{flex:1 1 100%}
  .seg button{flex:1;padding:0 6px}
  .toggles{flex:1 1 100%}
  .toggles .tog{flex:1}
}
@media (max-width:760px){
  h1{font-size:clamp(26px,7.4vw,32px);letter-spacing:.08em}
  .mark{margin-bottom:14px}
  .lede{margin-bottom:20px;font-size:18px}
  .hero{padding:22px 20px 20px}
  .actions{gap:8px 18px}
  .btn-primary{min-width:156px;padding:0 26px}
  .seg button .n{display:none}
}
@media (max-width:900px){
  .hero{max-width:560px;margin-left:0}
}
@media (max-width:760px), (orientation:portrait) and (max-width:1100px){
  :root{--dock-h:112px}
  .overlay{grid-template-rows:auto 1fr auto}
  .hero{grid-row:3;align-self:end;max-width:none;margin:0;padding:24px 22px 22px;border-radius:24px}
  .stage img{object-position:50% 30%}
  .dock{padding:8px;gap:8px;justify-content:space-between}
  .dock-title,.desc{display:none}
  .seg.obj{flex:1 1 100%}
  .seg.obj button{flex:1;padding:0 6px}
  .toggles{flex:1 1 100%}
  .toggles .tog,.toggles .fx,.toggles .fx-sum{flex:1}
  .fx-sum{width:100%;justify-content:center}
}
@media (max-width:760px){
  h1{font-size:clamp(26px,7.4vw,32px);letter-spacing:.08em}
  .mark{margin-bottom:14px}
  .lede{margin-bottom:20px;font-size:18px}
  .hero{padding:22px 20px 20px}
  .actions{gap:8px 18px}
  .btn-primary{min-width:156px;padding:0 26px}
  .seg button .n,.seg .long{display:none}
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">

<div class="stage three-on" id="stage" aria-hidden="true">
  <picture id="poster">
    <source id="posterPortrait" media="(max-width:760px), (orientation:portrait) and (max-width:1100px)" srcset="posters/escultura-portrait.jpg">
    <img id="posterImg" src="posters/escultura.jpg" alt="" decoding="async">
  </picture>
</div>

<div class="overlay">
  <header class="top">
    <div class="lang" role="group" aria-label="Idioma" id="langGroup">
      <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="true">ES</button>
      <button type="button" data-lang="ca" lang="ca" aria-label="Català" aria-pressed="false">CA</button>
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="hero" id="hero" lang="es" aria-labelledby="h1">
    <p class="mark">ComfyMind</p>
    <h1 id="h1" data-t="h1">Un lugar tranquilo para crear</h1>
    <p class="lede" data-t="lede">Tómate tu tiempo. Aquí no hay una forma correcta de hacerlo.</p>
    <div class="actions">
      <button type="button" class="btn-primary" id="begin" data-t="begin">Comenzar</button>
      <a class="link-quiet" href="#terapeuta" id="therapist" data-t="therapist">Soy terapeuta</a>
    </div>
    <p class="note" id="note" role="status" aria-live="polite"></p>
    <p class="fallback" id="fallback">3D isn’t available on this device, so a still image is shown instead.</p>
  </main>
</div>

<aside class="dock" aria-label="Prototype controls" lang="en">
  <span class="dock-title">Prototype</span>
  <div class="seg obj" role="group" aria-label="Object">
    <button type="button" data-object="ruina" aria-pressed="false"><span class="n">1</span>Ruina</button>
    <button type="button" data-object="escultura" aria-pressed="true"><span class="n">2</span>Escultura<span class="long">&nbsp;abstracta</span></button>
    <button type="button" data-object="estudio" aria-pressed="false"><span class="n">3</span>Estudio</button>
  </div>
  <p class="desc" id="desc"></p>
  <div class="toggles">
    <button type="button" class="tog" id="motionBtn" aria-pressed="true">Motion: <b>on</b></button>
    <button type="button" class="tog" id="threeBtn" aria-pressed="true">3D: <b>on</b></button>
    <details class="fx" id="fxDetails">
      <summary class="fx-sum" id="fxSum">FX: <b>on</b></summary>
      <div class="fx-panel" role="group" aria-label="Post effects">
        <div class="fx-row"><span>Post effects</span><button type="button" class="tog" id="fxBtn" aria-pressed="true">FX: <b>on</b></button></div>
        <div class="fx-row fx-dep"><span>Pixel size</span>
          <div class="seg" role="group" aria-label="Pixel size">
            <button type="button" data-px="2" aria-pressed="false">1/2</button>
            <button type="button" data-px="3" aria-pressed="true">1/3</button>
            <button type="button" data-px="4" aria-pressed="false">1/4</button>
          </div></div>
        <div class="fx-row fx-dep"><span>Dither</span>
          <div class="seg" role="group" aria-label="Dither">
            <button type="button" data-dither="off" aria-pressed="false">Off</button>
            <button type="button" data-dither="light" aria-pressed="true">Light</button>
            <button type="button" data-dither="strong" aria-pressed="false">Strong</button>
          </div></div>
        <div class="fx-row fx-dep"><span>Film grain (static)</span><button type="button" class="tog" id="grainBtn" aria-pressed="true">Grain: <b>on</b></button></div>
        <div class="fx-row fx-dep"><span>Soft vignette</span><button type="button" class="tog" id="vigBtn" aria-pressed="false">Vignette: <b>off</b></button></div>
      </div>
    </details>
  </div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
/* Copy and dock state work even if 3D never loads. The scene itself is scene/sanctuaryScene.js,
   a byte-identical copy of frontend/src/components/sanctuary/scene/sanctuaryScene.js (the source of truth). */
const COPY = {
  es:{h1:'Un lugar tranquilo para crear', lede:'Tómate tu tiempo. Aquí no hay una forma correcta de hacerlo.', begin:'Comenzar', therapist:'Soy terapeuta',
      noteBegin:'Prototipo: aquí empezaría tu sesión.', noteTher:'Prototipo: aquí se abriría el acceso para terapeutas.', lang:'Idioma'},
  ca:{h1:'Un lloc tranquil per crear', lede:'Pren-te el teu temps. Aquí no hi ha una manera correcta de fer-ho.', begin:'Començar', therapist:'Sóc terapeuta',
      noteBegin:'Prototip: aquí començaria la teva sessió.', noteTher:'Prototip: aquí s’obriria l’accés per a terapeutes.', lang:'Idioma'},
  en:{h1:'A quiet place to make something', lede:'Take your time. There is no right way to do this.', begin:'Begin', therapist:'I’m a therapist',
      noteBegin:'Prototype: your session would start here.', noteTher:'Prototype: the therapist sign-in would open here.', lang:'Language'},
};
const OBJECT_TEXT = {
  ruina:'<b>Ruina.</b> Architecture only: an Ionic capital on the plinth and two fallen drums. Tap the scene: it turns slowly.',
  escultura:'<b>Escultura abstracta.</b> A pierced, curved marble form carved out of a rough block (non finito). Tap: it turns slowly.',
  estudio:'<b>Estudio.</b> The sculptor’s study: Dürer’s solid, a honed sphere and a ring. Tap: the light moves round.',
};
const DITHER = {off:0, light:0.35, strong:0.8};
const store = {
  get(k){ try{ return localStorage.getItem('liminal2.'+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('liminal2.'+k, v); }catch(e){} },
};
const qs = new URLSearchParams(location.search);
const pick = (k, d) => qs.has(k) ? qs.get(k) : (store.get(k) ?? d);
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const state = {
  lang: pick('lang', 'es'),
  object: pick('object', 'escultura'),
  motion: pick('motion', reduceMQ.matches ? '0' : '1') === '1',
  three: pick('three', '1') !== '0',
  fx: pick('fx', '1') !== '0',
  px: Number(pick('px', '3')),
  dither: pick('dither', 'light'),
  grain: pick('grain', '1') !== '0',
  vignette: pick('vignette', '0') === '1',
};
if (!COPY[state.lang]) state.lang = 'es';
if (!OBJECT_TEXT[state.object]) state.object = 'escultura';
if (![2, 3, 4].includes(state.px)) state.px = 3;
if (!(state.dither in DITHER)) state.dither = 'light';

const $ = s => document.querySelector(s);
const stage = $('#stage'), hero = $('#hero'), note = $('#note');

function setLang(l){
  state.lang = l; store.set('lang', l);
  const c = COPY[l];
  document.documentElement.lang = l; hero.lang = l;
  hero.querySelectorAll('[data-t]').forEach(el => { el.textContent = c[el.dataset.t]; });
  $('#langGroup').setAttribute('aria-label', c.lang);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  note.textContent = '';
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#begin').addEventListener('click', () => { note.textContent = COPY[state.lang].noteBegin; });
$('#therapist').addEventListener('click', e => { e.preventDefault(); note.textContent = COPY[state.lang].noteTher; });

function setPoster(o){
  $('#posterImg').src = `posters/${o}.jpg`;
  $('#posterPortrait').srcset = `posters/${o}-portrait.jpg`;
}
const onOff = v => v ? 'on' : 'off';
function toggle(el, label, v){ el.setAttribute('aria-pressed', String(v)); el.innerHTML = `${label}: <b>${onOff(v)}</b>`; }
function renderDock(){
  document.querySelectorAll('[data-object]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.object === state.object)));
  document.querySelectorAll('[data-px]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.px) === state.px)));
  document.querySelectorAll('[data-dither]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dither === state.dither)));
  $('#desc').innerHTML = OBJECT_TEXT[state.object];
  toggle($('#motionBtn'), 'Motion', state.motion);
  toggle($('#threeBtn'), '3D', state.three);
  toggle($('#fxBtn'), 'FX', state.fx);
  toggle($('#grainBtn'), 'Grain', state.grain);
  toggle($('#vigBtn'), 'Vignette', state.vignette);
  $('#fxSum').innerHTML = `FX: <b>${onOff(state.fx)}</b>`;
  $('.fx-panel').classList.toggle('fx-off', !state.fx);
  stage.classList.toggle('three-on', state.three);
}
setLang(state.lang);
setPoster(state.object);
renderDock();

let scene = null;
const sceneOptions = () => ({
  object: state.object, fx: state.fx, pixelScale: state.px, motion: state.motion,
  dither: DITHER[state.dither], grain: state.grain ? 0.5 : 0, vignette: state.vignette ? 1 : 0,
});
function apply(){ renderDock(); if (scene) scene.setOptions(sceneOptions()); }
const bind = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.addEventListener('click', () => { fn(b); apply(); }));
bind('[data-object]', b => { state.object = b.dataset.object; store.set('object', state.object); setPoster(state.object); });
bind('[data-px]', b => { state.px = Number(b.dataset.px); store.set('px', String(state.px)); });
bind('[data-dither]', b => { state.dither = b.dataset.dither; store.set('dither', state.dither); });
bind('#motionBtn', () => { state.motion = !state.motion; store.set('motion', state.motion ? '1' : '0'); });
bind('#fxBtn', () => { state.fx = !state.fx; store.set('fx', state.fx ? '1' : '0'); });
bind('#grainBtn', () => { state.grain = !state.grain; store.set('grain', state.grain ? '1' : '0'); });
bind('#vigBtn', () => { state.vignette = !state.vignette; store.set('vignette', state.vignette ? '1' : '0'); });
bind('#threeBtn', () => {
  state.three = !state.three; store.set('three', state.three ? '1' : '0');
  if (state.three) start(); else stop();
});
reduceMQ.addEventListener('change', () => {
  if (store.get('motion') === null && !qs.has('motion')) { state.motion = !reduceMQ.matches; apply(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#fxDetails').open){ $('#fxDetails').open = false; $('#fxSum').focus(); } });

function noWebGL(){
  document.body.classList.add('no-webgl');
  stage.classList.remove('three-on', 'rendered');
  $('#threeBtn').disabled = true;
}

let loading = null;
async function start(){
  if (scene || loading) return;
  const canvas = document.createElement('canvas');
  canvas.setAttribute('aria-hidden', 'true');
  stage.appendChild(canvas);
  loading = import('./scene/sanctuaryScene.js').then(async ({ createSanctuaryScene, hasWebGL }) => {
    if (!hasWebGL()) throw new Error('no WebGL');
    scene = await createSanctuaryScene(canvas, {
      ...sceneOptions(), framing: 'landing',
      onReady(){ canvas.classList.add('ready'); stage.classList.add('rendered'); },
      onError(err){ console.warn('3D stopped:', err.message); stop(); noWebGL(); },
    });
    window.__liminal = scene;
  }).catch(err => { console.warn('3D unavailable:', err); canvas.remove(); noWebGL(); })
    .finally(() => { loading = null; if (!state.three) stop(); });
}
function stop(){
  if (scene){ scene.dispose(); scene = null; window.__liminal = null; }
  stage.querySelectorAll('canvas').forEach(c => c.remove());
  stage.classList.remove('rendered');
}
if (state.three) start();
</script>
